plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ppapi.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ppapi.mobile'
        minSdk 23
        targetSdk 34
        versionCode 17
        versionName '1.14.0'
    }

    buildTypes {
        release {
            // Keep compatibility with the APKs already installed from this workspace.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
