name: Build iOS package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build for iPhone and iPad
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project ios/PpApiMobile.xcodeproj \
            -scheme PpApiMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/pp-ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/pp-ios-build/Build/Products/Release-iphoneos/PpApiMobile.app"
          payload="$RUNNER_TEMP/pp-ios-package/Payload"
          test -f "$app/PpApiMobile"
          test -f "$app/www/index.html"
          test -f "$app/www/js/pages-dashboard.js"
          test -f "$app/www/js/pages-channel.js"
          test -f "$app/www/js/updates.js"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          file "$app/PpApiMobile" | grep -q arm64
          mkdir -p "$payload"
          ditto "$app" "$payload/PpApiMobile.app"
          cd "$RUNNER_TEMP/pp-ios-package"
          ditto -c -k --keepParent Payload "$GITHUB_WORKSPACE/Pp-API-iOS-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/Pp-API-iOS-unsigned.ipa" | grep -E 'Payload/PpApiMobile.app/(PpApiMobile|www/index.html)$'
          shasum -a 256 "$GITHUB_WORKSPACE/Pp-API-iOS-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: Pp-API-iOS-unsigned
          path: Pp-API-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Build for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/PpApiMobile.xcodeproj \
            -scheme PpApiMobile \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/pp-ios-simulator" \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build
      - name: Launch in iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[] | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")) |
            .value[] | select(.isAvailable and (.name | startswith("iPhone")))] | .[0].udid // empty')
          test -n "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$RUNNER_TEMP/pp-ios-simulator/Build/Products/Release-iphonesimulator/PpApiMobile.app"
          xcrun simctl launch "$udid" com.ppapi.mobile
          sleep 10
          xcrun simctl spawn "$udid" launchctl list | grep -F com.ppapi.mobile
          xcrun simctl io "$udid" screenshot "$GITHUB_WORKSPACE/Pp-API-iOS-simulator.png"
      - uses: actions/upload-artifact@v4
        with:
          name: Pp-API-iOS-simulator
          path: Pp-API-iOS-simulator.png
          if-no-files-found: error
          retention-days: 30
